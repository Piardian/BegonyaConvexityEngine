name: Risk Configuration Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  read-only-risk-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit and backtest entry point
        run: python -m py_compile scripts/audit_risk_config.py run_convexity_backtest.py
      - name: Run risk configuration contract tests
        run: python -m unittest discover -s tests -v
      - name: Run read-only risk configuration audit
        run: python scripts/audit_risk_config.py
